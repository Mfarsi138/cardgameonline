name: Develop GitHub Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to implement'
        required: true
        type: string

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch issue details
        id: issue
        run: |
          ISSUE_NUM="${{ inputs.issue_number }}"
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUM" --json title -q '.title')
          ISSUE_BODY=$(gh issue view "$ISSUE_NUM" --json body -q '.body')
          echo "number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read developer agent prompt
        id: prompt
        run: |
          PROMPT=$(cat .ai/developer.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run OpenCode Developer Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/anthropic/claude-sonnet-4
          prompt: |
            ${{ steps.prompt.outputs.content }}

            ---

            ## Current Task

            Implement Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}

            ### Issue Description

            ${{ steps.issue.outputs.body }}

            ### Instructions

            1. Read the issue description above
            2. Create branch `autoagent/${{ steps.issue.outputs.number }}-<short-slug>`
            3. Explore the codebase to understand current implementation
            4. Implement the changes described in the issue
            5. Add or update tests for behavioral changes
            6. Run: `dotnet build OhHell.sln --warnas-errors` and `dotnet test OhHell.sln`
            7. Commit with message: `feat: <description> (closes #${{ steps.issue.outputs.number }})`
            8. Push branch and open PR with body: `Closes #${{ steps.issue.outputs.number }}`

      - name: Comment on success
        if: success()
        run: |
          PR_URL=$(gh pr list --search "head:autoagent/${{ steps.issue.outputs.number }}" --json url -q '.[0].url' 2>/dev/null || echo "")
          if [ -n "$PR_URL" ]; then
            gh issue comment "${{ steps.issue.outputs.number }}" \
              --body "Implementation complete. PR: ${PR_URL}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --body "Autoagent failed. [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
