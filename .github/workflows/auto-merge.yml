name: Auto Merge

on:
  pull_request:
    types: [synchronize]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Check if PR is autoagent branch
        id: check
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == autoagent/* ]]; then
            echo "is_autoagent=true" >> $GITHUB_OUTPUT
          else
            echo "is_autoagent=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for checks
        if: steps.check.outputs.is_autoagent == 'true'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "Waiting for checks to complete on PR #${PR_NUM}..."

          # Wait up to 10 minutes for all checks to pass
          for i in $(seq 1 60); do
            CHECKS=$(gh pr checks "$PR_NUM" --json state --jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED")] | length' 2>/dev/null || echo "1")
            if [ "$CHECKS" -eq "0" ]; then
              echo "All checks passed."
              exit 0
            fi
            echo "Waiting... ($i/60) - $CHECKS checks still running"
            sleep 10
          done

          echo "Timeout waiting for checks."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash merge
        if: steps.check.outputs.is_autoagent == 'true'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          gh pr merge "$PR_NUM" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
