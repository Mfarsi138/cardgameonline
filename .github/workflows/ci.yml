name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OhHell.sln

      - name: Build
        run: dotnet build OhHell.sln --no-restore --warnas-errors

      - name: Test
        run: dotnet test OhHell.sln --no-build --verbosity normal
