name: Review PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read reviewer agent prompt
        id: prompt
        run: |
          PROMPT=$(cat .ai/reviewer.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run OpenCode Reviewer Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/anthropic/claude-sonnet-4
          prompt: |
            ${{ steps.prompt.outputs.content }}

            ---

            ## Current Task

            Review Pull Request #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Branch: ${{ github.head_ref }} → ${{ github.base_ref }}

            ### Instructions

            1. Read the PR description and linked issue
            2. Examine the diff for this PR
            3. Check for: bugs, security issues, performance, code quality
            4. Post inline comments on specific lines if issues found
            5. End with exactly one verdict: APPROVE, REQUEST_CHANGES, or NEEDS_DISCUSSION

            ### Files to review

            Read the diff and review all changed files. Focus on:
            - Game logic correctness (OhHell.Core)
            - Timer/state management (GameSession.cs, MultiplayerGameService.cs)
            - UI changes (Home.razor, app.css)
            - Test coverage (GameTests.cs)
